{% extends 'base.html' %}
{% block content %}
    <form>
        {% csrf_token %}
        <section id="mainform" class="w3-row w3-container w3-half">
            <div>
                <div id="formpart">{% include 'partials/forms.html' %}</div>
            </div>
        </section>
        <section class="w3-row w3-container w3-half">
            <div id="searchbar">
                {% include 'partials/searchbar.html' %}
                <input type="search" id="search" class="w3-input">
            </div>
            <div>
                <div id="tableview">{% include 'partials/tableview.html' %}</div>
            </div>
        </section>
    </form>
{% endblock %}
{% block modal %}
    <form autocomplete="on">
        {% csrf_token %}
        <div id="modalview"></div>
    </form>
{% endblock %}
