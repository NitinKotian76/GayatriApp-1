<div id="dynform">
    {% csrf_token %}
    {{ form }}
    {% if formset %}
        <div id="formset">{% include 'partials/formset.html' with formset=formset  formset_form=formset_form %}</div>
    {% endif %}
    {% autoescape off %}
        <div>
            {% for button in buttons %}{{ button }}{% endfor %}
        </div>
    {% endautoescape %}
</div>
