<div id="reel-preview" class="w3-container w3-margin-top" hx-swap-oob="true">
    {% if reel_numbers %}
        <p class="w3-small">Reels: {{ reel_total }}</p>
        <table class="w3-table-all w3-tiny w3-responsive " style="height:400px;width:fit-content; overflow-y:auto;">
            <thead>
                <tr>
                    <th>Reel No</th>
                    <th>No Of BDLS</th>
                    <th>No Of REAM</th>
                    <th>REAM Wt.</th>
                    <th>Weight</th>
                </tr>
            </thead>
            <tbody>
                {% for reelno in reel_numbers %}
                <tr>
                    <td>{{ reelno }}</td>
                    <td>{{ noofbdls_per_row }}</td>
                    <td>{{ noofream_per_row }}</td>
                    <td>{{ reamwt_per_row }}</td>
                    <td>{{ weight_per_row }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <p class="w3-small w3-text-grey">Total: {{ weight|default:0 }}</p>
    {% endif %}
</div>
