[project]
name = "gaytriapp"
version = "0.1.0"
description = ""
authors = [{ name = "Nixon Nelson", email = "nixonnelson22@gmail.com" }]
requires-python = "~=3.11.0"
readme = "README.md"
dependencies = [
    "gunicorn>=22.0.0,<23",
    "pymemcache>=4.0.0,<5",
    "django-extensions>=3.2.3,<4",
    "psycopg2-binary>=2.9.10,<3",
    "django~=5.2",
    "python-decouple>=3.8",
    "django-axes>=8.0.0",
    "weasyprint>=67.0",
    "django-htmx>=1.27.0",
    "autopep8>=2.3.2",
    "django-autocomplete-light>=3.12.1",
    "django-debug-toolbar>=4.4.6",
    "openpyxl>=3.1.5",
    "pillow>=12.1.0",
    "sphinx>=8.2.3",
]
[dependency-groups]
dev = [
    "django-sonar>=0.1.8,<0.2",
    "django-debug-toolbar>=4.4.2,<5",
    "argcomplete>=3.5.3,<4",
    "httpie>=3.2.3,<4",
]
test = [
    "selenium>=4.21.0,<5",
    "coverage>=7.5.3,<8",
]
documentation = ["sphinx>=8.1.3,<9"]

[tool.uv]
package = false
default-groups = [
    "dev",
    "test",
    "documentation",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

