<!DOCTYPE html>
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"
          type="image/x-icon"
          href="{% static 'invoice/images/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'invoice/css/w3.css' %}">
    <link rel="stylesheet" href="{% static 'invoice/css/style.css' %}">
    <script src="{% static 'invoice/script/htmx.min.js'%}" defer></script>
    <script src="{% static 'invoice/script/json-enc.js'%}" defer></script>
    <script src="{% static 'invoice/script/CustomScript.js'%}" defer></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    {% block nav %}
        <div class="navigation">
            <nav>
                <ul class="w3-light-blue w3-bar w3-padding">
                    {% if user.is_superuser %}
                        {% include 'partials/adminnav.html' %}
                    {% else %}
                        {% include 'partials/usernav.html' %}
                    {% endif %}
                    <div class="w3-right w3-dropdown-hover">
                        <a href="#"
                           class="w3-button w3-ripple w3-round-large w3-green"
                           onclick='document.getElementById("modalView").style.display="block"'
                           hx-get="/invoice/profile_user"
                           hx-target="#modalView"
                           hx-swap="innerHTML">Profile</a>
                        <div class="w3-dropdown-content w3-bar-block w3-card-4 w3-margin-right">
                            <div class="w3-bar-item w3-button w3-ripple">
                                {% block profileView %}{% endblock %}
                            </div>
                        </div>
                    </div>
                </ul>
            </nav>
        {% endblock %}
    </div>
    <main>
        {% block modal %}{% endblock %}
        {% block content %}{% endblock %}
    </main>
    <footer>
        <address>
        </address>
    </footer>
</body>
</html>
