<table
  class="w3-table-all"
  hx-get="/invoice/tableview"
  hx-target="#tableview"
  hx-trigger="loadform"
  hx-swap="outerHTML"
>
  <tr>
    {% for item in model_headers %}
    <th>{{ item }}</th>
    {% endfor %}
  </tr>
  {% for all_rows in query_results %}
  <tr>
    {% for every_column in all_rows %}
    <td>{{ every_column }}</td>
    {% endfor %}
  </tr>
  {% endfor %}
</table>
